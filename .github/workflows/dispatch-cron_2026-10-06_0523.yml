# ─────────────────────────────────────────────────────────────────────────────
# FILE    : .github/workflows/dispatch-cron_2026-10-06_0523.yml
# PROJECT : Handled (HandledServices) — AI-run home & business services
# CREATED : 2026-10-06_0523 UTC
# PURPOSE : Calls /api/cron/dispatch every 10 minutes (expired job offers go to the next
#           pros; the next Email Center batch goes out). This runs on GitHub Actions
#           because Vercel Hobby only allows crons that run once a day.
# SETUP   : nothing to copy. The job signs in with a GitHub Actions token (OIDC, audience "handled-cron") that the
#           site checks against GitHub's keys and this repository (apps/web/lib/cron-auth.ts). It calls
#           https://www.handledsvc.com unless the repository variable HANDLED_URL says otherwise. A CRON_SECRET
#           repository secret still works if one is set and the token can't be issued.
# UPDATED : 2026-11-05_1240 UTC — GitHub Actions token instead of a copied CRON_SECRET; live site as the default URL.
# NOTE    : GitHub runs schedules from the default branch only, and may start a run a
#           few minutes late when GitHub is busy.
# ─────────────────────────────────────────────────────────────────────────────
name: Dispatch cron

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: dispatch-cron
  cancel-in-progress: false

permissions:
  id-token: write   # the GitHub Actions token the site checks (no shared secret)

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron/dispatch
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          HANDLED_URL: ${{ vars.HANDLED_URL }}
        run: |
          URL="${HANDLED_URL:-https://www.handledsvc.com}"
          # a short-lived token signed by GitHub for this repository; fall back to a CRON_SECRET secret if there is one
          AUTH=""
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            AUTH=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=handled-cron" | jq -r .value)
          fi
          if [ -z "$AUTH" ] || [ "$AUTH" = "null" ]; then AUTH="$CRON_SECRET"; fi
          if [ -z "$AUTH" ]; then
            echo "::error::Couldn't get a GitHub Actions token (check that the workflow may use id-token) and no CRON_SECRET secret is set."
            exit 1
          fi
          curl -fsS --max-time 150 --retry 2 --retry-delay 10 \
            -H "Authorization: Bearer $AUTH" \
            "${URL%/}/api/cron/dispatch"
          echo
